<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Session</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="book.css">
</head>
<body>
    <div class="topContainer">
        <div class="title">
            <h1>Tutor Match</h1>
        </div>
        <div class="topBar">Book Session</div>
    </div>

    <h2>Book a Session</h2>
    <div class="tutorInfo">
        <h3>Tutor Name: John Doe</h3>
        <h3>Subject: Math</h3>
    </div>
    <div class="schedule">
        <label for="date">Select Date:</label>
        <input type="date" id="date" name="date">

    </div>
    <label for="time">Select Time:</label>
    <input type="time" id="time" name="time">

    <div>
        <h4>Session Details:</h4>
        <input class="details" type="text" placeholder="Enter any specific topics or questions you want to cover...">
    </div>
    <button class="bookButton">Confirm Booking</button>
    <div class="footer">
        <a href ="#">Home</a>
        <a href ="#">About</a>
        <a href ="#">Contact</a>
    </div>
