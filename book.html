<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Session</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="book.css">
</head>

<body>
    <!-- Header -->
    <div class="topContainer">
        <h1 class="title">Tutor Match</h1>
        <div class="topBar">Book Session</div>
    </div>
    <!-- Main -->
    <div class="mainContent">

        <div class="bookingCard">

            <h2>Book a Session</h2>

            <div class="bookingSummary">
                <p><strong>Tutor Name:</strong> John Doe</p>
                <p><strong>Subject:</strong> Math</p>
            </div>
            <!-- Help -->
            <p class="helpText">
                Need help? Select a date and time, then describe what you need help with before confirming your booking.
            </p>

            <div class="details">

                <div class="bookingRow">
                    <div class="fieldGroup">
                        <label for="date">Select Date:</label>
                        <input type="date" id="date" name="date">
                    </div>

                    <div class="fieldGroup">
                        <label for="time">Select Time:</label>
                        <input type="time" id="time" name="time">
                    </div>
                </div>

                <div class="fieldGroup">
                    <label for="sessionDetails">Session Details:</label>
                    <textarea id="sessionDetails" name="sessionDetails" placeholder="Enter any specific topics or questions you want to cover..."></textarea>
                </div>
                <!-- Confirm Button -->
                <a href="confirmation.html">
                    <button class="confirmButton">Confirm Booking</button>
                </a>

            </div>
        </div>
    </div>
    <!-- Footer -->
    <div class="footer">
        <a href="home.html">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

</body>
</html>
