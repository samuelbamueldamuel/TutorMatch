<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="search.css">
</head>

<body>

    <div class="topContainer">
        <h1 class="title">Tutor Match</h1>
        <div class="topBar">Search Tutors</div>
    </div>

    <div class="mainContent">

        <div class="searchBar">
            <input type="text" placeholder="Search for tutors...">
            <button>Search</button>
        </div>

        <p class="helpText">Use filters to narrow down tutors based on subject, rating, or price.</p>

        <div class="filters">
            <h3>Filter by Subject:</h3>
            <select>
                <option value="all">All Subjects</option>
                <option value="math">Math</option>
                <option value="science">Science</option>
                <option value="english">English</option>
                <option value="history">History</option>
            </select>

            <h3>Filter by Rating:</h3>
            <select>
                <option value="all">All Ratings</option>
                <option value="1">★☆☆☆☆ & Up</option>
                <option value="2">★★☆☆☆ & Up</option>
                <option value="3">★★★☆☆ & Up</option>
                <option value="4">★★★★☆ & Up</option>
                <option value="5">★★★★★ Only</option>
            </select>

            <h3>Filter by Price:</h3>
            <select>
                <option value="l2h">Low to High</option>
                <option value="h2l">High to Low</option>
            </select>
        </div>

        <div class="tutors">
            <div class="tutorCard">
                <h4>John Doe</h4>
                <p>Math Tutor</p>
                <p class="rating">★★★★☆</p>
                <a href="book.html">
                    <button class="bookButton">Book Now</button>
                </a>
            </div>

            <div class="tutorCard">
                <h4>Jane Smith</h4>
                <p>Science Tutor</p>
                <p class="rating">★★★★★</p>
                <a href="book.html">
                    <button class="bookButton">Book Now</button>    
                </a>
            </div>

            <div class="tutorCard">
                <h4>Emily Johnson</h4>
                <p>English Tutor</p>
                <p class="rating">★★★★☆</p>
                <a href="book.html">
                    <button class="bookButton">Book Now</button>
                </a>
            </div>
        </div>

    </div>

    <div class="footer">
        <a href="home.html">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

</body>
</html>
