<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="home.css">
</head>

<body>

    <div class="topContainer">
        <h1 class="title">Tutor Match</h1>
        <div class="topBar">Home Page</div>
    </div>

    <div class="mainContent">

        <div class="searchBar">
            <input type="text" placeholder="Search for tutors...">
            <button onclick="location.href='search.html'">Search</button>
        </div>

        <div class="subjects">
            <ul>
                <li><a href="search.html">Math</a></li>
                <li><a href="search.html">Science</a></li>
                <li><a href="search.html">English</a></li>
                <li><a href="search.html">History</a></li>
            </ul>
        </div>

        <p class="helpText">Select a tutor card to view more details and continue to booking.</p>

        <h3 class="homeSectionTitle">Recommended Tutors</h3>

        <div class="tutorList">
            <a href="tutor.html" class="tutorLink">
                <div class="tutorCard">
                    <h4>John Doe</h4>
                    <p>Math Tutor</p>
                    <p class="rating">★★★★☆</p>
                </div>
            </a>

            <a href="tutor.html" class="tutorLink">
                <div class="tutorCard">
                    <h4>Jane Smith</h4>
                    <p>Science Tutor</p>
                    <p class="rating">★★★★★</p>
                </div>
            </a>

            <a href="tutor.html" class="tutorLink">
                <div class="tutorCard">
                    <h4>Emily Johnson</h4>
                    <p>English Tutor</p>
                    <p class="rating">★★★★☆</p>
                </div>
            </a>
        </div>

    </div>

    <div class="footer">
        <a href="home.html">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

</body>
</html>
